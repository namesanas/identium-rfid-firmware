plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.taglink.mobile"
    compileSdk flutter.compileSdkVersion
    // The jni plugin builds native code and requires this NDK.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId "com.taglink.mobile"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // Signed with the local debug key so the APK installs directly;
            // a Play Store build needs its own upload key.
            signingConfig signingConfigs.debug
        }
    }
}

flutter { source "../.." }
