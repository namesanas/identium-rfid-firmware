name: Firmware build

on:
  push:
  pull_request:

jobs:
  hostcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tools/fw_sign.py signs the bootloader test images.
      - name: Install Python cryptography
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography

      - name: Host-side tests
        working-directory: STM32_Firmware
        run: make hostcheck PYTHON=python3

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [f429, f411]
        config: [debug, release]
    env:
      # The Makefile puts F429 output in build/<config>, F411 in build/f411-<config>.
      OUT: ${{ matrix.board == 'f429' && matrix.config || format('f411-{0}', matrix.config) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build (${{ matrix.board }} ${{ matrix.config }})
        working-directory: STM32_Firmware
        run: make -j"$(nproc)" BOARD=${{ matrix.board }} CONFIG=${{ matrix.config }} EXTRA_CFLAGS=-Werror

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.config }}
          path: |
            STM32_Firmware/build/${{ env.OUT }}/rfid_controller*.elf
            STM32_Firmware/build/${{ env.OUT }}/rfid_controller*.hex
            STM32_Firmware/build/${{ env.OUT }}/rfid_controller*.bin
            STM32_Firmware/build/${{ env.OUT }}/rfid_controller*.map
            STM32_Firmware/build/boot-${{ matrix.board }}/bootloader.*
